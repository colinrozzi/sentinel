# packr 0.11.0 plain-build link recipe (composites retired). packr-guest's
# setup_guest!() links dlmalloc in; the cdylib exports its own growable memory +
# __pack_alloc/__pack_free and imports only host theater:simple/*. The bare
# name.wasm is directly loadable — no compose step. For devshell / plain-cargo
# builds; the nix+crane build passes the same two link-args via
# CARGO_ENCODED_RUSTFLAGS (crane ignores this file). See theater
# docs/self-contained-actor-recipe.md (top block).
[target.wasm32-unknown-unknown]
rustflags = [
    "-C", "link-arg=--export-memory",
    "-C", "link-arg=--no-entry",
]
