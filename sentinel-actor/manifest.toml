name = "sentinel"
version = "0.1.0"
package = "/home/colin/work/actors/sentinel/target/wasm32-unknown-unknown/release/sentinel.wasm"
# initial_state is a JSON blob (replace at deploy time):
#   {
#     "listen_addr": "0.0.0.0:8444",
#     "bearer_token": "<shared secret for the deploy endpoint>",
#     "children": {
#       "<child-name>": {
#         "manifest_template": "<TOML body with __PACKAGE__ + __SECRET__ placeholders>",
#         "default_package":   "<URL or path to wasm for initial spawn>",
#         "secrets":           { "SECRET_NAME": "<value>", ... }
#       },
#       ...
#     }
#   }
# Each child's manifest_template must contain the literal token __PACKAGE__
# (sentinel substitutes the current package URL at every spawn). Secrets are
# RAM-only and never persisted on sentinel's side. Names appear in TCP
# requests: `start { name, package }`, `stop { name }`.
#
# CURRENT PRODUCTION REFERENCE: deploy/cutover-2026-06-05-mail.json
#   Option-A cutover (mail.colinrozzi.com only via frontdoor; inbox./tickets.
#   defer until per-host certs land). Three children: inbox-acceptor +
#   frontdoor + tickets-acceptor (inbox-API consumer for tickets@; no public
#   listener, but supervised under sentinel for crash recovery).
#   Operator-secret placeholders to substitute before inlining as initial_state:
#     __SENTINEL_BEARER__        sentinel's TCP command-surface bearer
#     __INBOX_BEARER__           inbox API bearer (single token or rotation list)
#     __INBOX_DKIM_KEY__         PEM with literal \n escapes (multi-line illegal in JSON)
#     __TICKETS_API_TOKEN__      tickets HTTP API bearer
#     __TICKETS_INBOX_TOKEN__    inbox API bearer for tickets@colinrozzi.com (separate from __INBOX_BEARER__)
#   Wrap the substituted JSON in TOML triple-quote literal:
#     initial_state = '''{...}'''
#   (Single-quote triple — TOML literal preserves the JSON's `"` characters
#   verbatim and tolerates `'` chars in the inlined inbox-acceptor template
#   body. JSON never contains `'''`, so the wrap is unambiguous.)
initial_state = "{}"

[[handler]]
type = "runtime"

[[handler]]
type = "supervisor"

[[handler]]
type = "tcp"

[[handler]]
type = "store"
store_id = "sentinel"
