name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Single sequential job on purpose: build + clippy + fmt share the theater
  # dependency, rust toolchain, and cargo artifacts. Running them as separate
  # concurrent jobs made both hammer the GitHub-backed magic-nix-cache at once
  # and tripped its rate limit (HTTP 418 ResourceExhausted). One job fetches the
  # deps once; clippy/fmt then reuse the already-built store paths — reliable and
  # faster (no duplicate theater compile).
  ci:
    name: build + verify self-contained + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main

      # sentinel uses crane + `theater compose` (NOT `theater build`): crane
      # cargo-builds the fixed-base members with CARGO_ENCODED_RUSTFLAGS, then
      # the flake's installPhase fuses each with the packr bundled allocator into
      # a self-contained <name>.composite.wasm. `nix build .#default` is the exact
      # thing that produced the deployed prod artifact, so CI exercises that path.
      - name: nix build .#default (composites)
        run: |
          set -euo pipefail
          echo "::group::nix build .#default"
          nix build .#default -L
          echo "::endgroup::"
          ls -la result/

      # Belt-and-suspenders on top of `theater compose`'s own verify: each
      # composite validates and every RESIDUAL import is a host theater:simple/*
      # func (no env.memory / pack:alloc / __linear_memory) — i.e. self-contained.
      # sentinel.composite.wasm is the deploy artifact; crashing_child is the
      # end-to-end test child (must also be self-contained to spawn under 0.10.x).
      - name: Assert composites are self-contained (host-only imports)
        run: |
          set -euo pipefail
          for C in result/sentinel.composite.wasm result/crashing_child.composite.wasm; do
            test -f "$C" || { echo "::error::composite not emitted: $C"; exit 1; }
            nix run nixpkgs#wasm-tools -- validate "$C"
            bad=$(nix run nixpkgs#wasm-tools -- print "$C" \
              | grep -E '^[[:space:]]*\(import ' | grep -v 'theater:simple/' || true)
            if [ -n "$bad" ]; then
              echo "::error::$C has non-host imports (not self-contained):"
              echo "$bad"
              exit 1
            fi
            echo "self-contained: $C ($(stat -c%s "$C") bytes)"
          done

      # Both are flake outputs (fixed-base rustflags flow through commonArgs), so
      # `nix build` runs the check and fails the job on any warning/diff. They
      # reuse the deps already fetched above — no extra cache round-trips.
      - name: clippy (-D warnings)
        run: nix build .#clippy -L

      - name: fmt (--check)
        run: nix build .#fmt -L
