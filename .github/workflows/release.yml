name: Release

on:
  # Tag-driven release. Push a `release-*` tag (or run via workflow_dispatch on
  # a branch) to cut a versioned, self-contained sentinel composite + sha256 +
  # direct-spawn manifest.
  push:
    tags: ['release-*']
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  release:
    name: Build composite + tag + upload artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main

      # Same crane + `theater compose` path as CI and prod: `nix build .#default`
      # emits result/sentinel.composite.wasm (deploy artifact) and
      # result/crashing_child.composite.wasm (e2e test child).
      - name: nix build .#default (composite)
        run: |
          set -euo pipefail
          echo "::group::nix build .#default"
          nix build .#default -L
          echo "::endgroup::"
          ls -la result/

      - name: Assert composite is self-contained (host-only imports)
        run: |
          set -euo pipefail
          C="result/sentinel.composite.wasm"
          test -f "$C" || { echo "::error::composite not emitted: $C"; exit 1; }
          nix run nixpkgs#wasm-tools -- validate "$C"
          bad=$(nix run nixpkgs#wasm-tools -- print "$C" \
            | grep -E '^[[:space:]]*\(import ' | grep -v 'theater:simple/' || true)
          if [ -n "$bad" ]; then
            echo "::error::sentinel composite has non-host imports (not self-contained):"
            echo "$bad"
            exit 1
          fi
          echo "sentinel composite self-contained: $C ($(stat -c%s "$C") bytes)"

      - name: Create GitHub release and upload artifacts
        run: |
          set -euo pipefail
          if [ -n "${GITHUB_REF_NAME:-}" ] && [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            DATE=$(date +%Y%m%d)
            SHA=$(git rev-parse --short=7 HEAD)
            TAG="release-$DATE-$SHA"
            git tag "$TAG"
            git push origin "$TAG"
          fi
          gh release create "$TAG" --generate-notes

          STAGE_TAG="${TAG#release-}"
          REPO="${{ github.repository }}"

          # Deploy artifact = the self-contained COMPOSITE (a bare member is
          # rejected by the 0.10.x loader). Copy out of the read-only nix store.
          COMPOSITE_FILE="sentinel-${STAGE_TAG}.composite.wasm"
          cp "result/sentinel.composite.wasm" "${COMPOSITE_FILE}"
          chmod +w "${COMPOSITE_FILE}"

          # sha256 sidecar: this is the checksum Phase-2's `POST /deploy
          # {url, sha256}` endpoint will verify before swapping the binary, so
          # publish it alongside the composite.
          sha256sum "${COMPOSITE_FILE}" | awk '{print $1}' > "${COMPOSITE_FILE}.sha256"

          COMPOSITE_URL="https://github.com/${REPO}/releases/download/${TAG}/${COMPOSITE_FILE}"

          # Direct-spawn manifest: self-referencing `package` URL, no
          # `initial_state` (supply a real JSON config at spawn time). Use with
          # `theater spawn` from a local checkout for smoke testing.
          MANIFEST_FILE="sentinel-${STAGE_TAG}.toml"
          cat > "${MANIFEST_FILE}" <<TOML
          name = "sentinel"
          version = "0.1.0"
          package = "${COMPOSITE_URL}"

          [[handler]]
          type = "runtime"

          [[handler]]
          type = "supervisor"

          [[handler]]
          type = "tcp"

          [[handler]]
          type = "store"

          [[handler]]
          type = "timer"

          [[handler]]
          type = "message-server"
          TOML

          gh release upload "$TAG" \
            "${COMPOSITE_FILE}" "${COMPOSITE_FILE}.sha256" "${MANIFEST_FILE}"

          echo "Released $TAG:"
          echo "  composite: ${COMPOSITE_FILE} ($(stat -c%s "${COMPOSITE_FILE}") bytes)"
          echo "  sha256:    $(cat "${COMPOSITE_FILE}.sha256")"
          echo "  manifest:  ${MANIFEST_FILE}"
        env:
          GH_TOKEN: ${{ github.token }}
