# packr compose manifest — sentinel (entry) + the mesh-client component.
#
# NOTE: the CANONICAL, reproducible compose is generated by flake.nix (which pins
# mesh_client_pkg.wasm to the mesh v0.3.0 release by content hash). This file is a
# dev/reference copy for a manual `packr compose deploy/sentinel.compose.toml`;
# point the mesh-client `wasm` at a locally-downloaded v0.3.0 mesh_client_pkg.wasm.
#
# sentinel imports the `mesh` + `mesh-control` interfaces (declared in full in
# pack_types for the hash-checked links); one [[link]] per function it calls
# satisfies those from the mesh-client exports (export = the hyphenated pact name
# verbatim). message-server-host.request is NOT linked — the mesh-client component
# owns it; it stays residual for theater. Both interfaces internalize on compose,
# so the composite is host-only.

# Paths are resolved relative to THIS manifest's directory (deploy/).
[[component]]
name  = "sentinel"
wasm  = "../target/wasm32-unknown-unknown/release/sentinel.wasm"
entry = true

[[component]]
name = "mesh-client"
wasm = "/tmp/mesh030_client.wasm"   # dev: a locally-downloaded mesh v0.3.0 mesh_client_pkg.wasm

[[link]]
consumer = "sentinel"
import   = "mesh.submit"
provider = "mesh-client"
export   = "submit"

[[link]]
consumer = "sentinel"
import   = "mesh.register"
provider = "mesh-client"
export   = "register"

[[link]]
consumer = "sentinel"
import   = "mesh.delivery"
provider = "mesh-client"
export   = "delivery"

[[link]]
consumer = "sentinel"
import   = "mesh.is-ready"
provider = "mesh-client"
export   = "is-ready"

[[link]]
consumer = "sentinel"
import   = "mesh-control.control-kind"
provider = "mesh-client"
export   = "control-kind"

[[link]]
consumer = "sentinel"
import   = "mesh-control.decode-command"
provider = "mesh-client"
export   = "decode-command"

[[link]]
consumer = "sentinel"
import   = "mesh-control.encode-response"
provider = "mesh-client"
export   = "encode-response"
